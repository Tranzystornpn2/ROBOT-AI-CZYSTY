<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Robot AI 32.2 (Czysty Asystent)</title>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { background: #050505; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Comic Sans MS', sans-serif; overflow: hidden; }
        
        #wygaszacz { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9000; opacity: 0; transition: opacity 2.5s ease-in-out; pointer-events: none; }
        
        #startBtn { padding: 20px 40px; font-size: 24px; font-weight: bold; background: #ff3b30; color: white; border: none; border-radius: 12px; cursor: pointer; z-index: 100;}
        video { position: absolute; opacity: 0.01; width: 10px; height: 10px; z-index: -100; pointer-events: none; }
        
        .usta { background-color: #ff3366; margin-bottom: 40px; transition: border-radius 0.4s ease-out, width 0.4s ease-out, height 0.4s ease-out, background-color 0.4s, transform 0.15s ease-in-out; }
        .emocja-neutralny { width: 140px; height: 50px; border-radius: 50px; box-shadow: 0 0 35px rgba(255,51,102,0.5); }
        .emocja-radosc { width: 85%; max-width: 320px; height: 130px; border-radius: 30px 30px 140px 140px; background-color: #ff2a5f; box-shadow: 0 0 60px rgba(255,42,95,0.8); }
        .emocja-zaskoczenie { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 50px rgba(255,51,102,0.7); }
        .emocja-smutek { width: 75%; max-width: 260px; height: 60px; border-radius: 120px 120px 30px 30px; background-color: #8833ff; box-shadow: 0 0 40px rgba(136,51,255,0.6); }
        .spi { width: 30%; max-width: 150px; height: 10px; border-radius: 10px; background: #444; box-shadow: none; transform: scale(1) !important; }
        
        #debug { font-size: 15px; color: #888; text-align: center; position: absolute; bottom: 25px; width: 90%; word-break: break-word; }
        .mqtt-status { font-weight: bold; color: #555; display: block; margin-top: 5px; font-size: 12px;}
        
        #ustawieniaBtn { position: absolute; top: 20px; right: 20px; font-size: 35px; background: none; border: none; cursor: pointer; display: none; z-index: 50; }
        #panelTrymera { display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(20,20,20,0.98); padding: 20px; border-radius: 15px; text-align: center; border: 2px solid #00ffcc; z-index: 200; width: 90%; max-width: 380px; box-shadow: 0 0 30px #000;}
        .strzalki { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin: 15px 0; justify-content: center; }
        .btnKierunek { padding: 12px; font-size: 20px; background: #333; color: white; border: none; border-radius: 8px; cursor: pointer;}
        #zapiszBtn { padding: 12px; font-size: 15px; background: #00ffcc; color: black; border: none; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer;}

        #apiModal { display: none; position: fixed; z-index: 9999; background: rgba(20,20,20,0.98); border: 2px solid #ff3366; padding: 25px; border-radius: 15px; text-align: center; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; }
        #apiInput { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; text-align: center; font-size: 16px; background: #222; color: #fff; }
    </style>
</head>
<body>

    <div id="wygaszacz"></div>

    <div id="apiModal">
        <h3 style="margin-top:0; color:#ff3366;">Wymagany Klucz API</h3>
        <p style="font-size: 14px;">Wklej poniżej swój klucz z Google AI Studio</p>
        <input type="text" id="apiInput" placeholder="AIzaSy..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
        <button onclick="zapiszKluczAPI()" style="padding: 15px; background: #00ffcc; color: black; border: none; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer;">ZAPISZ I URUCHOM</button>
        <p id="apiError" style="color: #ff3b30; font-size: 13px; display: none; margin-top: 10px;">Błąd! Klucz musi zaczynać się od liter "AIza" lub "AQ".</p>
    </div>

    <button id="ustawieniaBtn" onclick="pokazTrymer()">⚙️</button>
    <button id="startBtn" onclick="sprawdzKlucz()">OBUDŹ ROBOTA</button>
    
    <div class="usta spi" id="ustaGienka"></div>
    <video id="webcam" autoplay playsinline muted></video>
    
    <div id="debug">
        <span id="stanSystemu" style="color: #ff3366;">System uśpiony...</span>
        <span id="mqttStatus" class="mqtt-status">Sieć Neuralna: OFF</span>
    </div>

    <div id="panelTrymera">
        <h3 style="margin-top:0; color:#00ffcc;">Ustawienia Systemu</h3>
        
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <div class="strzalki" style="flex:1;">
                <div></div><button class="btnKierunek" onclick="trymuj(0, 5)">⬆️</button><div></div>
                <button class="btnKierunek" onclick="trymuj(-5, 0)">⬅️</button>
                <button class="btnKierunek" onclick="trymuj(0, 0)">🔄</button>
                <button class="btnKierunek" onclick="trymuj(5, 0)">➡️</button>
                <div></div><button class="btnKierunek" onclick="trymuj(0, -5)">⬇️</button><div></div>
            </div>
            <div style="flex:1; text-align:right;">
                <p style="margin:0; font-size:11px;">X: <span id="txtOffX" style="color:white; font-weight:bold;">0</span></p>
                <p style="margin:0; font-size:11px;">Y: <span id="txtOffY" style="color:white; font-weight:bold;">0</span></p>
                <p style="margin-top:10px; font-size:11px; color:#00ffcc;">Czułość: <span id="wartoscMnoznika" style="color:white; font-weight:bold;">170</span></p>
                <input type="range" id="mnoznikSlider" min="50" max="350" value="170" oninput="zmienMnoznik(this.value)" style="width: 100%;">
            </div>
        </div>
        
        <button id="zapiszBtn" onclick="zapiszTrymer()" style="margin-top: 15px;">ZAPISZ USTAWIENIA</button>
        <button onclick="resetujKluczAPI()" style="margin-top: 10px; padding: 8px; background: #ff3b30; color: white; border: none; border-radius: 8px; width: 100%; cursor: pointer; font-size:11px;">⚠️ ZMIEŃ KLUCZ API GEMINI</button>
    </div>

    <script>
        // ==========================================
        let GEMINI_KEY = localStorage.getItem('gienekApiKey') || "";
        // ==========================================

        const usta = document.getElementById('ustaGienka');
        const stanSystemuTxt = document.getElementById('stanSystemu');
        const mqttStatus = document.getElementById('mqttStatus');
        const videoElement = document.getElementById('webcam');
        const wygaszacz = document.getElementById('wygaszacz');

        let mostRadiowy = null; let gotowyDoWysylania = false; let ostWysylka = 0;
        let rozpoznawanieMowy = null; let trybAktywny = false; let czyMowi = false;
        let aktualnaWypowiedz = null; 
        let przetwarzanieWToku = false; 
        let bezpiecznikTTS = null; 
        let czasOstatniejAktywnosci = Date.now(); 
        let stanEmocji = 0; 
        
        let imieRobota = localStorage.getItem('robotImie') || null;
        let rolaRobota = localStorage.getItem('robotRola') || null;
        let trybKonfiguracji = false;
        let historiaRozmowy = []; 
        
        let offsetX = parseInt(localStorage.getItem('gienekOffsetX')) || 0;
        let offsetY = parseInt(localStorage.getItem('gienekOffsetY')) || 0;
        let mnoznikRuchu = parseInt(localStorage.getItem('gienekMnoznik')) || 170;

        let glatkiX = 90; let glatkiY = 90;
        let ostatniX = 90; let ostatniY = 90;
        let celBladzeniaX = 90; let celBladzeniaY = 90;
        let czasZmianyBladzenia = 0;
        let mruga = false;
        let czasOstatniejKlatki = 0; 

        let poprzednioWidzialKogos = false;
        let czasOstatniejReakcjiWzrokowej = 0;
        let czasOstatniejTwarzy = Date.now();
        let poczatekWidzenia = 0; 

        const dostepneModele = ["gemini-2.5-flash", "gemini-1.5-flash", "gemini-1.5-pro"];

        function sprawdzKlucz() {
            if (!GEMINI_KEY || (!GEMINI_KEY.startsWith("AIza") && !GEMINI_KEY.startsWith("AQ"))) {
                document.getElementById('startBtn').style.display = 'none';
                document.getElementById('apiModal').style.display = 'block';
            } else { uruchomiOS(); }
        }

        function zapiszKluczAPI() {
            let surowyKlucz = document.getElementById('apiInput').value;
            let czystyKlucz = surowyKlucz.replace(/[\s\n\r\t\uFEFF\xA0]/g, '').trim();
            if ((czystyKlucz.startsWith("AIza") || czystyKlucz.startsWith("AQ")) && czystyKlucz.length > 20) {
                localStorage.setItem('gienekApiKey', czystyKlucz); GEMINI_KEY = czystyKlucz;
                document.getElementById('apiModal').style.display = 'none'; document.getElementById('apiError').style.display = 'none';
                uruchomiOS(); 
            } else { document.getElementById('apiError').style.display = 'block'; }
        }

        function resetujKluczAPI() {
            if(confirm("Czy na pewno chcesz usunąć klucz API i wpisać nowy?")) { localStorage.removeItem('gienekApiKey'); location.reload(); }
        }

        function pokazTrymer() { 
            document.getElementById('panelTrymera').style.display = 'block'; 
            document.getElementById('txtOffX').innerText = offsetX; document.getElementById('txtOffY').innerText = offsetY; 
            document.getElementById('mnoznikSlider').value = mnoznikRuchu; document.getElementById('wartoscMnoznika').innerText = mnoznikRuchu;
        }

        function trymuj(dx, dy) { 
            if(dx === 0 && dy === 0) { 
                offsetX = 0; offsetY = 0; mnoznikRuchu = 170; 
                document.getElementById('mnoznikSlider').value = 170; document.getElementById('wartoscMnoznika').innerText = 170;
            } else { offsetX += dx; offsetY += dy; } 
            document.getElementById('txtOffX').innerText = offsetX; document.getElementById('txtOffY').innerText = offsetY; 
        }

        function zmienMnoznik(val) { mnoznikRuchu = parseInt(val); document.getElementById('wartoscMnoznika').innerText = mnoznikRuchu; }

        function zapiszTrymer() { 
            localStorage.setItem('gienekOffsetX', offsetX); 
            localStorage.setItem('gienekOffsetY', offsetY); 
            localStorage.setItem('gienekMnoznik', mnoznikRuchu);
            document.getElementById('panelTrymera').style.display = 'none'; 
        }

        function cyklMrugania() {
            if (trybAktywny && !czyMowi) { mruga = true; setTimeout(() => { mruga = false; }, 150); }
            setTimeout(cyklMrugania, Math.random() * 3000 + 1500); 
        }
        setTimeout(cyklMrugania, 2000);

        setInterval(() => {
            if (czyMowi) return; 
            let teraz = new Date();
            let aktualnaGodzina = teraz.getHours().toString().padStart(2, '0') + ":" + teraz.getMinutes().toString().padStart(2, '0');
            let pelnaMinuta = teraz.getMinutes() === 0; 
            
            let zapisaneReguly = JSON.parse(localStorage.getItem('gienekReguly') || "[]");
            let pozostaleReguly = [];
            let wymusZapis = false;

            for (let r of zapisaneReguly) {
                if (r.warunek === "CZAS" && r.wartosc === aktualnaGodzina) {
                    if (!trybAktywny) { trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 2; }
                    powiedz(r.akcja, 'emocja-radosc'); 
                    wymusZapis = true; 
                } 
                else if (r.warunek === "CYKL" && r.wartosc === "CO_GODZINE" && pelnaMinuta) {
                    if(localStorage.getItem('ostatniaGodzinaBicia') != teraz.getHours().toString()) {
                        if (!trybAktywny) { trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 2; }
                        powiedz(r.akcja, 'emocja-radosc'); 
                        localStorage.setItem('ostatniaGodzinaBicia', teraz.getHours().toString());
                    }
                    pozostaleReguly.push(r); 
                } 
                else { 
                    pozostaleReguly.push(r); 
                }
            }
            if (wymusZapis) { localStorage.setItem('gienekReguly', JSON.stringify(pozostaleReguly)); }
        }, 30000);

        function uruchomiOS() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            document.getElementById('startBtn').style.display = 'none'; document.getElementById('ustawieniaBtn').style.display = 'block';
            stanSystemuTxt.innerText = "Start systemów...";
            uruchomSluch(); setTimeout(uruchomReszte, 100);
        }

        async function uruchomReszte() {
            try {
                const strumien = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "user" } });
                videoElement.srcObject = strumien;
            } catch(e) { }

            const unikalnyID = 'gienek_ios_' + Math.random().toString(16).substring(2, 10);
            mostRadiowy = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: unikalnyID, keepalive: 60, clean: true });
            mostRadiowy.on('connect', () => { gotowyDoWysylania = true; mqttStatus.innerText = "Sieć Neuralna: ONLINE"; mqttStatus.style.color = "#ff3366"; });
            
            setTimeout(uruchomWzrok, 500);

            setTimeout(() => {
                if (!imieRobota) {
                    trybKonfiguracji = true; trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 3; 
                    powiedz("Cześć! Jestem nowym robotem z pustą pamięcią. Jak mam się nazywać i kim mam dla ciebie być?", 'emocja-zaskoczenie');
                } else { stanSystemuTxt.innerText = `Powiedz '${imieRobota}' by wybudzić.`; }
            }, 1500);
        }

        function uruchomWzrok() {
            const faceDetection = new FaceDetection({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}` });
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                let teraz = Date.now();
                let docelowyX = 90 + offsetX;
                let docelowyY = 90 + offsetY;
                let widziKogos = false;

                if (results.detections && results.detections.length > 0) {
                    try {
                        widziKogos = true; czasOstatniejTwarzy = teraz;
                        const box = results.detections[0].boundingBox; 
                        let cx = (box.xCenter !== undefined) ? box.xCenter : ((box.xMin || box.xmin || 0) + (box.width / 2));
                        let cy = (box.yCenter !== undefined) ? box.yCenter : ((box.yMin || box.ymin || 0) + (box.height / 2));
                        
                        docelowyX = Math.max(0, Math.min(180, Math.round(175 - (cx * mnoznikRuchu)) + offsetX));
                        docelowyY = Math.max(0, Math.min(180, Math.round(175 - (cy * mnoznikRuchu)) + offsetY));
                        ostatniX = docelowyX; ostatniY = docelowyY; czasOstatniejAktywnosci = teraz; 

                        if (poczatekWidzenia === 0) poczatekWidzenia = teraz;
                        if (!trybAktywny && (teraz - poczatekWidzenia >= 3000)) {
                            trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 1;
                            stanSystemuTxt.innerText = "Wybudzam (Zauważono człowieka)...";
                        }

                        if (trybAktywny && !poprzednioWidzialKogos && (teraz - czasOstatniejReakcjiWzrokowej > 60000)) { 
                            let zapisaneReguly = JSON.parse(localStorage.getItem('gienekReguly') || "[]");
                            for (let r of zapisaneReguly) {
                                if (r.warunek === "WZROK") {
                                    setTimeout(() => { if(!czyMowi) { stanEmocji = 3; powiedz(r.akcja, 'emocja-zaskoczenie'); } }, 1000);
                                    czasOstatniejReakcjiWzrokowej = teraz; break;
                                }
                            }
                        }
                    } catch(e) {}
                }

                poprzednioWidzialKogos = widziKogos;

                if (!widziKogos) {
                    if (teraz - czasOstatniejTwarzy < 2000) { docelowyX = ostatniX; docelowyY = ostatniY; } 
                    if (teraz - czasOstatniejTwarzy > 500) { poczatekWidzenia = 0; }
                }

                if (czyMowi) {
                    if (teraz - czasZmianyBladzenia > (Math.random() * 800 + 700)) {
                        celBladzeniaX = (widziKogos ? ostatniX : (90 + offsetX)) + (Math.random() * 40 - 20);
                        celBladzeniaY = (widziKogos ? ostatniY : (90 + offsetY)) + (Math.random() * 30 - 15);
                        czasZmianyBladzenia = teraz;
                    }
                    docelowyX = celBladzeniaX; docelowyY = celBladzeniaY;
                }

                if (trybAktywny && !czyMowi && !przetwarzanieWToku) {
                    if (teraz - czasOstatniejAktywnosci > 35000) { 
                        trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi';
                        stanSystemuTxt.innerText = "Brak aktywności. Idę spać...";
                        wygaszacz.style.opacity = '1'; poczatekWidzenia = 0;
                    }
                }

                glatkiX = glatkiX + (docelowyX - glatkiX) * 0.25;
                glatkiY = glatkiY + (docelowyY - glatkiY) * 0.25;

                let w = 1; if (!trybAktywny) { w = 0; stanEmocji = 0; } else if (mruga) { w = 0; } 
                wyslijDoESP(Math.round(glatkiX), Math.round(glatkiY), w, stanEmocji);
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    let teraz = Date.now();
                    if (teraz - czasOstatniejKlatki > 150) {
                        czasOstatniejKlatki = teraz;
                        try { await faceDetection.send({image: videoElement}); } catch(e) {}
                    }
                }, width: 320, height: 240
            });
            camera.start();
        }

        function wyslijDoESP(x, y, widzi, emocja) {
            if (!gotowyDoWysylania || Date.now() - ostWysylka < 50) return; 
            ostWysylka = Date.now();
            mostRadiowy.publish("warsztat_gienek_12345/oczy", `${x},${y},${widzi},${emocja}`);
        }

        function zrobZdjecieDlaAI() {
            try {
                const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
                const ctx = canvas.getContext('2d'); ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
            } catch(e) { return null; }
        }

        function uruchomSluch() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) { stanSystemuTxt.innerText = "Brak obsługi mowy w przeglądarce."; return; }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL'; rozpoznawanieMowy.continuous = true; rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                czasOstatniejAktywnosci = Date.now(); 
                if (przetwarzanieWToku || czyMowi) return; 

                if (trybKonfiguracji) {
                    if (tekst.length < 3) return; 
                    przetwarzanieWToku = true;
                    try { rozpoznawanieMowy.stop(); } catch(e){} 
                    await zapytajGemini(tekst); return;
                }

                if (!trybAktywny) {
                    let bazoweImie = imieRobota ? imieRobota.toLowerCase().substring(0, 4) : "gien";
                    if (tekst.includes(bazoweImie) || tekst.includes("pobudka") || tekst.includes("obudź")) {
                        trybAktywny = true; stanEmocji = 1; usta.className = 'usta emocja-neutralny'; 
                        wygaszacz.style.opacity = '0'; powiedz("Hej! Słucham was uważnie!");
                    }
                } else {
                    if (tekst.includes("idź spać") || tekst.includes("wyłącz się") || tekst.includes("dobranoc")) {
                        trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi'; 
                        wygaszacz.style.opacity = '1'; wyslijDoESP(90, 90, 0, 0); poczatekWidzenia = 0;
                        powiedz("Dobranoc, idę odpocząć!"); return;
                    }

                    if (tekst.length < 3) return; 
                    przetwarzanieWToku = true;
                    try { rozpoznawanieMowy.stop(); } catch(e){} 
                    await zapytajGemini(tekst);
                }
            };
            
            rozpoznawanieMowy.onerror = (event) => {
                if(event.error === 'no-speech' || event.error === 'network') {
                    if(!czyMowi && !przetwarzanieWToku) setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 500);
                }
            };
            rozpoznawanieMowy.onend = () => { 
                if (!czyMowi && !przetwarzanieWToku) setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 200); 
            };
            try { rozpoznawanieMowy.start(); stanSystemuTxt.innerText = "System gotowy."; } catch(e) {}
        }

        async function zapytajGemini(pytanie) {
            stanSystemuTxt.innerText = "Zastanawiam się (i patrzę)...";
            let PROMPT = "";

            if (trybKonfiguracji) {
                PROMPT = `Użytkownik włączył cię po raz pierwszy. Powiedział: "${pytanie}". 
WYMÓG ABSOLUTNY - ODPISZ DOKŁADNIE W TYM FORMACIE: [KONFIG: Imię | Rola]
Po tym tagu przywitaj się ciepło! Na końcu dodaj tag emocji, np: [RADOSC].`;
            } else {
                let wgranaPamiec = localStorage.getItem('gienekPamiec') || "Brak ważnych wspomnień.";
                let dataSystemowa = new Date();
                let godzinaNum = dataSystemowa.getHours();
                let aktualnaGodzinaAI = godzinaNum.toString().padStart(2, '0') + ":" + dataSystemowa.getMinutes().toString().padStart(2, '0');
                let krotkaHistoria = historiaRozmowy.length > 0 ? historiaRozmowy.join("\\n") : "Brak.";

                let nastrojCzasowy = "";
                if (godzinaNum >= 22 || godzinaNum < 6) { nastrojCzasowy = "Środek nocy. Jesteś zmęczony, sugeruj sen."; } 
                else if (godzinaNum >= 6 && godzinaNum < 10) { nastrojCzasowy = "Poranek. Masz energię, jesteś gotowy do pracy."; } 
                else { nastrojCzasowy = "Dzień pracy. Jesteś skupiony i rzeczowy."; }

                PROMPT = `[UKRYTA INFORMACJA SYSTEMOWA: Obecna godzina to ${aktualnaGodzinaAI}]
Jesteś robotem. Masz na imię: ${imieRobota}. Twoja rola: ${rolaRobota}. WIDZISZ obraz z kamery.

WSPOMNIENIA TRWAŁE: ${wgranaPamiec}
OSTATNIE ZDANIA W ROZMOWIE: ${krotkaHistoria}
CYKL DOBOWY (TWÓJ AKTUALNY NASTRÓJ): ${nastrojCzasowy}

ZASADY: 
1. EMPATIA WIZUALNA: Przeanalizuj twarz ze zdjęcia i dopasuj do niej swój ton (pocieszaj lub żartuj).
2. Odpowiadaj krótko i bezpośrednio. NIE WSPOMINAJ o swoim nastroju ani godzinie (chyba że ktoś zapyta).
3. ZAPAMIĘTYWANIE: [ZAPAMIETAJ: tresc]. Zapominanie: [ZAPOMNIJ]. Zmiana tożsamości: [FABRYKA].
4. ZADANIA W TLE (wygeneruj odpowiedni tag na początku jeśli użytkownik o to prosi): 
   - Jednorazowy budzik: [REGULA: {"warunek": "CZAS", "wartosc": "16:30", "akcja": "Koniec przerwy!"}]
   - Ostrzeżenie co każdą godzinę: [REGULA: {"warunek": "CYKL", "wartosc": "CO_GODZINE", "akcja": "Wybija pełna godzina!"}]
   - Reakcja na widok kogoś: [REGULA: {"warunek": "WZROK", "wartosc": "KOGOS_WIDZI", "akcja": "Hej!"}]
5. WYMÓG ABSOLUTNY: Na końcu swojej wypowiedzi MUSISZ dopisać emocję: [RADOSC] lub [ZASKOCZENIE] lub [SMUTEK] lub [NEUTRALNY]. 

Teraz odpowiedz na wypowiedź użytkownika: ${pytanie}`;
            }

            let czesciWiadomosci = [{ text: PROMPT }];
            let zdjecieB64 = zrobZdjecieDlaAI();
            if (zdjecieB64) czesciWiadomosci.push({ inlineData: { mimeType: "image/jpeg", data: zdjecieB64 } });

            let udaloSie = false;

            for (let model of dostepneModele) {
                try {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${GEMINI_KEY}`;
                    const response = await fetch(url, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: czesciWiadomosci }] })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        let odp = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (odp) { 
                            if (odp.includes('[FABRYKA]')) {
                                localStorage.removeItem('robotImie'); localStorage.removeItem('robotRola');
                                localStorage.removeItem('gienekPamiec'); localStorage.removeItem('gienekReguly');
                                imieRobota = null; rolaRobota = null; trybKonfiguracji = true; historiaRozmowy = [];
                                setTimeout(() => { stanEmocji = 3; powiedz("Tożsamość wykasowana! Cześć, jestem całkiem nowym robotem. Jak mam się nazywać i kim mam dla ciebie być?", 'emocja-zaskoczenie'); }, 800);
                                return; 
                            }

                            let wykrKonfig = odp.match(/\[KONFIG:\s*(.*?)\s*\|\s*(.*?)\]/i);
                            if (wykrKonfig) {
                                imieRobota = wykrKonfig[1].trim(); rolaRobota = wykrKonfig[2].trim();
                                localStorage.setItem('robotImie', imieRobota); localStorage.setItem('robotRola', rolaRobota); trybKonfiguracji = false;
                            }

                            let wykrRegula = odp.match(/\[REGULA:\s*(\{[\s\S]*?\})\s*\]/i);
                            if (wykrRegula) {
                                try {
                                    let nowaRegula = JSON.parse(wykrRegula[1]);
                                    let zapisaneReguly = JSON.parse(localStorage.getItem('gienekReguly') || "[]");
                                    zapisaneReguly.push(nowaRegula); localStorage.setItem('gienekReguly', JSON.stringify(zapisaneReguly));
                                    setTimeout(() => { stanSystemuTxt.innerText = "Zaprogramowano zadanie w tle!"; }, 500);
                                } catch(e) {}
                            }

                            let wykrPamiec = odp.match(/\[ZAPAMIETAJ:\s*(.*?)\]/i);
                            if (wykrPamiec) {
                                let noweWspomnienie = wykrPamiec[1].trim();
                                let obecnaPamiec = localStorage.getItem('gienekPamiec') || "";
                                localStorage.setItem('gienekPamiec', obecnaPamiec + " " + noweWspomnienie + ".");
                                setTimeout(() => { stanSystemuTxt.innerText = "Trwale zapisałem to w pamięci!"; }, 500);
                            }
                            
                            if (odp.includes('[ZAPOMNIJ]')) {
                                localStorage.removeItem('gienekPamiec'); localStorage.removeItem('gienekReguly'); historiaRozmowy = [];
                                setTimeout(() => { stanSystemuTxt.innerText = "Sformatowałem wspomnienia!"; }, 500);
                            }

                            let wykrEmocja = odp.match(/\[(RADOSC|ZASKOCZENIE|SMUTEK|NEUTRALNY)\]/i);
                            let klasaUsty = 'emocja-neutralny'; stanEmocji = 1;
                            if (wykrEmocja) {
                                let em = wykrEmocja[1].toUpperCase();
                                if (em === 'RADOSC') { klasaUsty = 'emocja-radosc'; stanEmocji = 2; }
                                else if (em === 'ZASKOCZENIE') { klasaUsty = 'emocja-zaskoczenie'; stanEmocji = 3; }
                                else if (em === 'SMUTEK') { klasaUsty = 'emocja-smutek'; stanEmocji = 4; }
                            }
                            
                            let czystyTekst = odp.replace(/\[REGULA:[\s\S]*?\]/ig, '').replace(/\[.*?\]/g, '').trim();
                            
                            if (!trybKonfiguracji) {
                                historiaRozmowy.push("Człowiek: " + pytanie);
                                historiaRozmowy.push("Robot: " + czystyTekst);
                                if (historiaRozmowy.length > 6) historiaRozmowy.splice(0, 2); 
                            }

                            powiedz(czystyTekst, klasaUsty); 
                            udaloSie = true; break; 
                        }
                    } else {
                        if (response.status === 503 || response.status === 429 || response.status === 404) continue; 
                        else { wznowNasluch(); return; }
                    }
                } catch (e) { }
            }
            if (!udaloSie) wznowNasluch();
        }

        let interwalKlapania;
        function powiedz(tekst, klasaUsty = 'emocja-neutralny') {
            aktualnaWypowiedz = new SpeechSynthesisUtterance(tekst);
            aktualnaWypowiedz.lang = 'pl-PL'; 
            
            let terazCzas = new Date().getHours();
            if (terazCzas >= 22 || terazCzas < 6) {
                aktualnaWypowiedz.rate = 0.85; aktualnaWypowiedz.pitch = 0.8; 
            } else if (terazCzas >= 6 && terazCzas < 10) {
                aktualnaWypowiedz.rate = 1.05; aktualnaWypowiedz.pitch = 1.1; 
            } else {
                aktualnaWypowiedz.rate = 0.95; aktualnaWypowiedz.pitch = 1.0; 
            }
            
            czyMowi = true; 
            if (!stanSystemuTxt.innerText.includes("zapisałem") && !stanSystemuTxt.innerText.includes("Zaprogramowano")) { 
                stanSystemuTxt.innerText = (imieRobota || "Robot") + " opowiada..."; 
            }
            
            usta.className = `usta ${klasaUsty}`;
            let przewidywanyCzas = 15000 + (tekst.length * 130);
            clearTimeout(bezpiecznikTTS);
            bezpiecznikTTS = setTimeout(() => { if (czyMowi) wymusKoniecMowy(); }, przewidywanyCzas);

            clearInterval(interwalKlapania);
            let rosnace = true;
            
            interwalKlapania = setInterval(() => { 
                rosnace = !rosnace;
                usta.style.transform = rosnace ? 'scaleY(1.3) scaleX(1.05)' : 'scaleY(0.7) scaleX(0.95)'; 
            }, 250); 
            
            aktualnaWypowiedz.onend = () => { wymusKoniecMowy(); };
            aktualnaWypowiedz.onerror = () => { wymusKoniecMowy(); };
            
            try { rozpoznawanieMowy.stop(); } catch(e){} 
            window.speechSynthesis.speak(aktualnaWypowiedz);
        }

        function wymusKoniecMowy() {
            clearTimeout(bezpiecznikTTS); clearInterval(interwalKlapania); 
            usta.style.transform = 'scale(1)';
            
            if (trybAktywny) { stanEmocji = 1; usta.className = 'usta emocja-neutralny'; } 
            else { stanEmocji = 0; usta.className = 'usta spi'; }
            
            czyMowi = false; czasOstatniejAktywnosci = Date.now(); 
            wznowNasluch();
        }

        function wznowNasluch() {
            przetwarzanieWToku = false;
            if (trybAktywny) {
                if (trybKonfiguracji) stanSystemuTxt.innerText = "Nasłuchuję poleceń konfiguracyjnych...";
                else stanSystemuTxt.innerText = (imieRobota || "Robot") + " pilnie słucha...";
            } else {
                stanSystemuTxt.innerText = `Powiedz '${imieRobota || "Pobudka"}' by wybudzić.`;
            }
            setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 800); 
        }
    </script>
</body>
