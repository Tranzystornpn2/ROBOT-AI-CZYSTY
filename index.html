<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gienek OS 34.1 (Cloud Hybryda)</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/face_detection.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body { background: #050505; color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Comic Sans MS', sans-serif; overflow: hidden; }
        
        #ekranWyboru { position: fixed; top:0; left:0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .btnWybor { width: 85%; max-width: 350px; padding: 25px; margin: 15px; border-radius: 15px; border: none; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-ai { background: #ff3366; color: white; box-shadow: 0 0 20px rgba(255,51,102,0.4); }
        .btn-zabawka { background: #00ffcc; color: black; box-shadow: 0 0 20px rgba(0,255,204,0.4); }

        #wygaszacz { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #000; z-index: 9000; opacity: 0; transition: opacity 2.5s ease-in-out; pointer-events: none; }
        video { position: absolute; opacity: 0.01; width: 10px; height: 10px; z-index: -100; pointer-events: none; }
        
        .usta { background-color: #ff3366; margin-bottom: 40px; transition: border-radius 0.4s ease-out, width 0.4s ease-out, height 0.4s ease-out, background-color 0.4s, transform 0.15s ease-in-out; }
        .emocja-neutralny { width: 140px; height: 50px; border-radius: 50px; box-shadow: 0 0 35px rgba(255,51,102,0.5); }
        .emocja-radosc { width: 85%; max-width: 320px; height: 130px; border-radius: 30px 30px 140px 140px; background-color: #ff2a5f; box-shadow: 0 0 60px rgba(255,42,95,0.8); }
        .emocja-zaskoczenie { width: 120px; height: 120px; border-radius: 50%; box-shadow: 0 0 50px rgba(255,51,102,0.7); }
        .emocja-smutek { width: 75%; max-width: 260px; height: 60px; border-radius: 120px 120px 30px 30px; background-color: #8833ff; box-shadow: 0 0 40px rgba(136,51,255,0.6); }
        .spi { width: 30%; max-width: 150px; height: 10px; border-radius: 10px; background: #444; box-shadow: none; transform: scale(1) !important; }
        
        #debug { font-size: 15px; color: #888; text-align: center; position: absolute; bottom: 25px; width: 90%; word-break: break-word; }
        .mqtt-status { font-weight: bold; color: #555; display: block; margin-top: 5px; font-size: 12px;}
        
        #apiModal { display: none; position: fixed; z-index: 10000; background: #111; border: 2px solid #ff3366; padding: 25px; border-radius: 15px; text-align: center; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; max-width: 350px; }
        #apiInput { width: 90%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: none; text-align: center; font-size: 16px; background: #222; color: #fff; }
        
        #resetKluczaBtn { position: absolute; top: 20px; right: 20px; background: #ff3b30; color: white; padding: 10px; border: none; border-radius: 8px; font-size: 12px; cursor: pointer; z-index: 8000; display: none; }
    </style>
</head>
<body>

    <div id="ekranWyboru">
        <h2 style="color:white; margin-bottom:5px;">WYBIERZ TRYB PRACY</h2>
        <p style="font-size:12px; color:#888; margin-bottom:30px; text-align:center;">Wymaga dostępu do internetu</p>
        
        <button class="btnWybor btn-ai" onclick="wybranoTryb('AI')">
            🔴 ZAAWANSOWANE AI<br>
            <span style="font-size:12px; font-weight:normal;">(Wymaga klucza Gemini)</span>
        </button>
        
        <button class="btnWybor btn-zabawka" onclick="wybranoTryb('OFFLINE')">
            🧸 ZABAWKA (Dla Dzieci)<br>
            <span style="font-size:12px; font-weight:normal;">(Lokalny słownik)</span>
        </button>
    </div>

    <div id="wygaszacz"></div>
    
    <button id="resetKluczaBtn" onclick="resetujKlucz()">ZMIEŃ KLUCZ</button>

    <div id="apiModal">
        <h3 style="margin-top:0; color:#ff3366;">Klucz API Gemini</h3>
        <p style="font-size: 14px;">Wklej klucz (AQ...) z Google AI Studio</p>
        <input type="text" id="apiInput" placeholder="AQ..." autocomplete="off">
        <button onclick="zapiszKluczAPI()" style="padding: 15px; background: #ff3366; color: white; border: none; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer;">ZAPISZ I URUCHOM</button>
        <p id="apiError" style="color: #ff3b30; font-size: 13px; display: none; margin-top: 10px;">Błąd! Za krótki klucz.</p>
    </div>
    
    <div class="usta spi" id="ustaGienka"></div>
    <video id="webcam" autoplay playsinline muted></video>
    
    <div id="debug">
        <span id="stanSystemu" style="color: #ff3366;">System czeka na wybór trybu...</span>
        <span id="mqttStatus" class="mqtt-status">Sieć MQTT: OFF</span>
    </div>

    <script>
        let TRYB_PRACY = null; 
        let GEMINI_KEY = localStorage.getItem('gienekApiKey') || "";
        let slownikDzieci = {};

        const usta = document.getElementById('ustaGienka');
        const stanSystemuTxt = document.getElementById('stanSystemu');
        const mqttStatus = document.getElementById('mqttStatus');
        const videoElement = document.getElementById('webcam');
        const wygaszacz = document.getElementById('wygaszacz');
        const resetBtn = document.getElementById('resetKluczaBtn');

        let mostRadiowy = null; let gotowyDoWysylania = false; let ostWysylkaRuchu = 0;
        let rozpoznawanieMowy = null; let trybAktywny = false; let czyMowi = false;
        let przetwarzanieWToku = false; let bezpiecznikTTS = null; 
        let czasOstatniejAktywnosci = Date.now(); let stanEmocji = 0; 
        
        let imieRobota = localStorage.getItem('robotImie') || null;
        let trybKonfiguracji = false;
        
        let glatkiX = 90; let glatkiY = 90;
        let ostatniX = 90; let ostatniY = 90;
        let celBladzeniaX = 90; let celBladzeniaY = 90;
        let czasZmianyBladzenia = 0; let mruga = false; let czasOstatniejKlatki = 0; 
        let poczatekWidzenia = 0; 

        function wybranoTryb(tryb) {
            TRYB_PRACY = tryb;
            document.getElementById('ekranWyboru').style.display = 'none';
            if (tryb === 'AI') {
                if (!GEMINI_KEY || GEMINI_KEY.length < 15) {
                    document.getElementById('apiModal').style.display = 'block';
                } else {
                    uruchomiOS();
                }
                resetBtn.style.display = 'block';
            } else {
                pobierzSlownik(); uruchomiOS();
            }
        }

        function pobierzSlownik() {
            let zapis = localStorage.getItem('gienekSlownik');
            if(zapis) slownikDzieci = JSON.parse(zapis);
            else slownikDzieci = {"cześć": "Witajcie!", "co robisz": "Pilnuję warsztatu"};
        }

        function zapiszSlownik() {
            localStorage.setItem('gienekSlownik', JSON.stringify(slownikDzieci));
        }

        function resetujKlucz() {
            if(confirm("Czy na pewno chcesz usunąć klucz API?")) {
                localStorage.removeItem('gienekApiKey');
                location.reload();
            }
        }

        function zapiszKluczAPI() {
            // Agresywne usuwanie niewidocznych spacji i enterów dodawanych przez klawiatury mobilne
            let k = document.getElementById('apiInput').value.replace(/[\s\n\r\t\uFEFF\xA0]/g, '').trim();
            if (k.length > 15) {
                localStorage.setItem('gienekApiKey', k); GEMINI_KEY = k;
                document.getElementById('apiModal').style.display = 'none'; uruchomiOS(); 
            } else {
                document.getElementById('apiError').style.display = 'block'; 
            }
        }

        function uruchomiOS() {
            window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); 
            stanSystemuTxt.innerText = "Start kamer i mikrofonu...";
            uruchomSluch(); setTimeout(uruchomReszte, 200);
        }

        async function uruchomReszte() {
            try {
                const strumien = await navigator.mediaDevices.getUserMedia({ audio: true, video: { facingMode: "user" } });
                videoElement.srcObject = strumien;
            } catch(e) { }

            const unikalnyID = 'gienek_ios_' + Math.random().toString(16).substring(2, 10);
            mostRadiowy = mqtt.connect('wss://broker.emqx.io:8084/mqtt', { clientId: unikalnyID, keepalive: 60, clean: true });
            mostRadiowy.on('connect', () => { gotowyDoWysylania = true; mqttStatus.innerText = "Sieć MQTT: ONLINE"; mqttStatus.style.color = "#00ffcc"; });

            setTimeout(uruchomWzrok, 500);

            setTimeout(() => {
                if (TRYB_PRACY === 'OFFLINE') {
                    imieRobota = "Robot"; trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 2;
                    powiedz("Tryb zabawki aktywowany! Znam już " + Object.keys(slownikDzieci).length + " słów.", "emocja-radosc");
                } else {
                    if (!imieRobota || imieRobota === "null") {
                        trybKonfiguracji = true; trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 3; 
                        powiedz("Cześć! Jestem nowym robotem. Jak mam się nazywać?", 'emocja-zaskoczenie');
                    } else { stanSystemuTxt.innerText = `Powiedz '${imieRobota}' by wybudzić.`; }
                }
            }, 2000);
        }

        function uruchomWzrok() {
            const faceDetection = new FaceDetection({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_detection/${file}` });
            faceDetection.setOptions({ model: 'short', minDetectionConfidence: 0.5 });

            faceDetection.onResults((results) => {
                let teraz = Date.now();
                let docelowyX = 90; let docelowyY = 90; let widziKogos = false;

                if (results.detections && results.detections.length > 0) {
                    try {
                        widziKogos = true;
                        const box = results.detections[0].boundingBox; 
                        let cx = (box.xCenter !== undefined) ? box.xCenter : ((box.xMin || box.xmin || 0) + (box.width / 2));
                        let cy = (box.yCenter !== undefined) ? box.yCenter : ((box.yMin || box.ymin || 0) + (box.height / 2));
                        
                        docelowyX = Math.max(0, Math.min(180, Math.round(175 - (cx * 170))));
                        docelowyY = Math.max(0, Math.min(180, Math.round(175 - (cy * 170))));
                        ostatniX = docelowyX; ostatniY = docelowyY; czasOstatniejAktywnosci = teraz; 

                        if (poczatekWidzenia === 0) poczatekWidzenia = teraz;
                        if (!trybAktywny && (teraz - poczatekWidzenia >= 2000)) {
                            trybAktywny = true; wygaszacz.style.opacity = '0'; stanEmocji = 1;
                            stanSystemuTxt.innerText = "Wybudzam...";
                            if(TRYB_PRACY === 'OFFLINE' && !czyMowi) powiedz("Hej, widzę cię!", "emocja-radosc");
                        }
                    } catch(e) {}
                }

                if (!widziKogos) poczatekWidzenia = 0;

                if (czyMowi) {
                    if (teraz - czasZmianyBladzenia > (Math.random() * 800 + 700)) {
                        celBladzeniaX = (widziKogos ? ostatniX : 90) + (Math.random() * 40 - 20);
                        celBladzeniaY = (widziKogos ? ostatniY : 90) + (Math.random() * 30 - 15);
                        czasZmianyBladzenia = teraz;
                    }
                    docelowyX = celBladzeniaX; docelowyY = celBladzeniaY;
                }

                if (trybAktywny && !czyMowi && !przetwarzanieWToku) {
                    if (teraz - czasOstatniejAktywnosci > 35000) { 
                        trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi';
                        stanSystemuTxt.innerText = "Brak aktywności. Sen...";
                        wygaszacz.style.opacity = '1'; poczatekWidzenia = 0;
                    }
                }

                glatkiX = glatkiX + (docelowyX - glatkiX) * 0.25; glatkiY = glatkiY + (docelowyY - glatkiY) * 0.25;
                let w = 1; if (!trybAktywny) { w = 0; stanEmocji = 0; } else if (mruga) { w = 0; } 
                
                if (gotowyDoWysylania && (Date.now() - ostWysylkaRuchu > 50)) {
                    mostRadiowy.publish("warsztat_gienek_12345/oczy", `${Math.round(glatkiX)},${Math.round(glatkiY)},${w},${stanEmocji}`);
                    ostWysylkaRuchu = Date.now();
                }
            });

            const camera = new Camera(videoElement, {
                onFrame: async () => { 
                    let teraz = Date.now();
                    if (teraz - czasOstatniejKlatki > 100) { czasOstatniejKlatki = teraz; try { await faceDetection.send({image: videoElement}); } catch(e) {} }
                }, width: 320, height: 240
            });
            camera.start();
        }

        function zrobZdjecieDlaAI() {
            try {
                const canvas = document.createElement('canvas'); canvas.width = 320; canvas.height = 240;
                const ctx = canvas.getContext('2d'); ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
                return canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
            } catch(e) { return null; }
        }

        function cyklMrugania() {
            if (trybAktywny && !czyMowi) { mruga = true; setTimeout(() => { mruga = false; }, 150); }
            setTimeout(cyklMrugania, Math.random() * 3000 + 1500); 
        }
        setTimeout(cyklMrugania, 2000);

        function uruchomSluch() {
            window.SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!window.SpeechRecognition) { stanSystemuTxt.innerText = "Brak obsługi mowy."; return; }

            rozpoznawanieMowy = new SpeechRecognition();
            rozpoznawanieMowy.lang = 'pl-PL'; rozpoznawanieMowy.continuous = true; rozpoznawanieMowy.interimResults = false;

            rozpoznawanieMowy.onresult = async (event) => {
                let tekst = event.results[event.results.length - 1][0].transcript.trim().toLowerCase();
                czasOstatniejAktywnosci = Date.now(); 
                if (przetwarzanieWToku || czyMowi) return; 

                if (!trybAktywny) {
                    if (tekst.includes("robot") || tekst.includes("gienek") || tekst.includes("pobudka")) {
                        trybAktywny = true; stanEmocji = 1; usta.className = 'usta emocja-neutralny'; 
                        wygaszacz.style.opacity = '0'; powiedz("Słucham cię!");
                    }
                    return;
                }

                if (tekst.includes("idź spać") || tekst.includes("dobranoc")) {
                    trybAktywny = false; stanEmocji = 0; usta.className = 'usta spi'; 
                    wygaszacz.style.opacity = '1'; 
                    if(gotowyDoWysylania) mostRadiowy.publish("warsztat_gienek_12345/oczy", `90,90,0,0`);
                    powiedz("Dobranoc!"); return;
                }

                if (tekst.length < 3) return; 
                przetwarzanieWToku = true; try { rozpoznawanieMowy.stop(); } catch(e){} 

                if (TRYB_PRACY === 'OFFLINE') zapytajZabawkeOffline(tekst);
                else await zapytajGemini(tekst);
            };
            
            rozpoznawanieMowy.onerror = (e) => { if(!czyMowi && !przetwarzanieWToku) setTimeout(()=> {try{rozpoznawanieMowy.start();}catch(e){}}, 500); };
            rozpoznawanieMowy.onend = () => { if (!czyMowi && !przetwarzanieWToku) setTimeout(()=> {try{rozpoznawanieMowy.start();}catch(e){}}, 200); };
            try { rozpoznawanieMowy.start(); stanSystemuTxt.innerText = "Mikrofon aktywny."; } catch(e) {}
        }

        // --- ZABAWKA (Tryb Offline) ---
        function zapytajZabawkeOffline(tekst) {
            stanSystemuTxt.innerText = "Przeszukuję bazę...";
            
            if (tekst.includes("naucz się") && tekst.includes("usłyszysz") && tekst.includes("powiedz")) {
                let p1 = tekst.substring(tekst.indexOf("usłyszysz") + 9);
                let wyzwalacz = p1.substring(0, p1.indexOf("powiedz")).trim();
                let odpowiedz = p1.substring(p1.indexOf("powiedz") + 7).trim();
                
                if (wyzwalacz.length > 0 && odpowiedz.length > 0) {
                    slownikDzieci[wyzwalacz] = odpowiedz; zapiszSlownik(); 
                    powiedz("Zapamiętałem! Jak usłyszę " + wyzwalacz + " to powiem to co kazałeś.", "emocja-radosc");
                    return;
                }
            }

            let znaleziono = false;
            let klucze = Object.keys(slownikDzieci).sort((a,b) => b.length - a.length); 
            for(let klucz of klucze) {
                if (tekst.includes(klucz)) { powiedz(slownikDzieci[klucz], "emocja-radosc"); znaleziono = true; break; }
            }
            if (!znaleziono) powiedz("Nie znam tego słowa. Możesz mnie nauczyć.", "emocja-zaskoczenie");
        }

        // --- AI (Tryb Gemini) ---
        async function zapytajGemini(pytanie) {
            stanSystemuTxt.innerText = "AI szuka w chmurze...";
            let PROMPT = trybKonfiguracji 
                ? `Powiedział: "${pytanie}". WYMÓG ABSOLUTNY - ODPISZ W FORMACIE: [KONFIG: Imię | Rola]. Dodaj na końcu przywitanie i [RADOSC].`
                : `Jesteś robotem. Masz na imię: ${imieRobota}. WIDZISZ obraz z kamery. Odpowiadaj krótko. NA KOŃCU ZDANIA MUSI BYĆ TAG EMOCJI: [RADOSC] lub [ZASKOCZENIE] lub [SMUTEK] lub [NEUTRALNY]. Pytanie: ${pytanie}`;

            let czesciWiadomosci = [{ text: PROMPT }];
            let zdjecieB64 = zrobZdjecieDlaAI(); if (zdjecieB64) czesciWiadomosci.push({ inlineData: { mimeType: "image/jpeg", data: zdjecieB64 } });

            try {
                // Bezpieczne wstawienie klucza w URL by ominąć błąd 401 w przeglądarkach mobilnych
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_KEY}`;
                
                const response = await fetch(url, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: czesciWiadomosci }] })
                });

                if (response.ok) {
                    const data = await response.json();
                    let odp = data.candidates?.[0]?.content?.parts?.[0]?.text || "Zgubiłem wątek. [ZASKOCZENIE]";
                    
                    let wykrKonfig = odp.match(/\[KONFIG:\s*(.*?)\s*\Vert{}\s*(.*?)\]/i);
                    if (wykrKonfig) { imieRobota = wykrKonfig[1].trim(); localStorage.setItem('robotImie', imieRobota); trybKonfiguracji = false; }

                    let klasaUsty = 'emocja-neutralny'; stanEmocji = 1;
                    if (odp.includes('[RADOSC]')) { klasaUsty = 'emocja-radosc'; stanEmocji = 2; }
                    else if (odp.includes('[ZASKOCZENIE]')) { klasaUsty = 'emocja-zaskoczenie'; stanEmocji = 3; }
                    else if (odp.includes('[SMUTEK]')) { klasaUsty = 'emocja-smutek'; stanEmocji = 4; }
                    
                    let czystyTekst = odp.replace(/\[.*?\]/g, '').trim(); if(czystyTekst.length < 2) czystyTekst = trybKonfiguracji ? "Zapisane!" : "Jasne.";
                    powiedz(czystyTekst, klasaUsty); 
                } else { 
                    powiedz("Problem z autoryzacją API. Błąd 401.", "emocja-smutek"); wznowNasluch(); 
                }
            } catch (e) { 
                powiedz("Chyba nie mam dostępu do internetu.", "emocja-smutek"); wznowNasluch(); 
            }
        }

        let interwalKlapania;
        function powiedz(tekst, klasaUsty = 'emocja-neutralny') {
            window.speechSynthesis.cancel();
            let ut = new SpeechSynthesisUtterance(tekst); ut.lang = 'pl-PL'; ut.rate = TRYB_PRACY === 'OFFLINE' ? 1.05 : 0.95; 
            czyMowi = true; stanSystemuTxt.innerText = "Robot mówi..."; usta.className = `usta ${klasaUsty}`;
            
            clearTimeout(bezpiecznikTTS); bezpiecznikTTS = setTimeout(() => { if (czyMowi) wymusKoniecMowy(); }, 15000 + (tekst.length * 100));

            clearInterval(interwalKlapania); let rosnace = true;
            interwalKlapania = setInterval(() => { rosnace = !rosnace; usta.style.transform = rosnace ? 'scaleY(1.3) scaleX(1.05)' : 'scaleY(0.7) scaleX(0.95)'; }, 250); 
            
            ut.onend = () => { wymusKoniecMowy(); }; ut.onerror = () => { wymusKoniecMowy(); };
            try { rozpoznawanieMowy.stop(); } catch(e){} 
            window.speechSynthesis.speak(ut);
        }

        function wymusKoniecMowy() {
            clearTimeout(bezpiecznikTTS); clearInterval(interwalKlapania); usta.style.transform = 'scale(1)';
            if (trybAktywny) { stanEmocji = 1; usta.className = 'usta emocja-neutralny'; } else { stanEmocji = 0; usta.className = 'usta spi'; }
            czyMowi = false; czasOstatniejAktywnosci = Date.now(); wznowNasluch();
        }

        function wznowNasluch() {
            przetwarzanieWToku = false; stanSystemuTxt.innerText = trybAktywny ? "Nasłuchuję..." : "Śpię.";
            setTimeout(() => { try { rozpoznawanieMowy.start(); } catch(e){} }, 800); 
        }
    </script>
</body>
</html>
